<!DOCTYPE html>

<title>Naruto Runner — Realistic Preview</title>
<style>

  #label b{color:#ff8c28;}
  #title{position:fixed;top:18px;left:50%;transform:translateX(-50%);
    color:#fff;font-size:1.3rem;font-weight:800;letter-spacing:1px;z-index:10;

  #title span{color:#ff8c28;}
</style>
</head>

<canvas id="c"></canvas>
<div id="title">NARUTO RUNNER — <span>REALISTIC</span> PREVIEW</div>
