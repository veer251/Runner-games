<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Demon Slayer: Infinity Castle Run (fan-made)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Shojumaru&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game"></div>
  <canvas id="speedlines"></canvas>
  <div id="vignette"></div>
  <div id="flash"></div>

  <div id="hud">
    <div id="progress"><div id="progress-fill"></div></div>
    <div id="cue"><canvas id="cue-canvas" width="120" height="120"></canvas><div id="cue-label">JUMP!</div></div>
    <div id="prompt"><canvas id="prompt-fig" width="260" height="260"></canvas><div id="prompt-text"></div><div id="pips"></div><div id="prompt-sub"></div></div>
    <div id="bigtext"></div>
    <div id="judge"></div>
    <div id="bossbar"><div class="bb-name">上弦 · UPPER MOON</div><div class="bb-track"><div id="boss-fill"></div></div></div>
    <div id="combo"><span id="combo-num">0</span><small>COMBO</small></div>
    <div id="touch">
      <button data-k="left">◀</button><button data-k="jump">▲</button><button data-k="action">⚔</button><button data-k="duck">▼</button><button data-k="right">▶</button>
    </div>
  </div>

  <div id="fade"></div>

  <div id="start" class="screen show">
    <div class="card">
      <div class="logo">鬼滅 <span>INFINITY CASTLE RUN</span></div>
      <button id="btn-play" class="play" aria-label="Play"></button>
      <div class="levels">
        <button data-level="0">1<small>Forest</small></button>
        <button data-level="1">2<small>Castle</small></button>
        <button data-level="2">3<small>Train</small></button>
        <button data-level="3">4<small>Boss</small></button>
      </div>
      <div class="keys">
        <span><b>A/D ←/→</b> lanes</span><span><b>W/Space</b> jump</span><span><b>S</b> duck</span><span><b>Shift</b> slash · smash · push</span>
        <span><b>1-4</b> level</span><span><b>P</b> pause</span><span><b>H</b> HUD</span><span><b>M</b> mute</span><span><b>F</b> fullscreen</span>
      </div>
      <div class="menu-row"><button class="menu-btn" data-open="settings">⚙ SETTINGS</button><button class="menu-btn" data-act="fullscreen">⛶ FULLSCREEN</button></div>
      <div class="note">Fan-made · not affiliated with the original creators</div>
    </div>
  </div>

  <div id="pause" class="screen">
    <div class="card">
      <div class="logo"><span>PAUSED</span></div>
      <div class="menu-col">
        <button class="menu-btn big" data-act="resume">▶ RESUME</button>
        <button class="menu-btn" data-act="restart">↻ RESTART LEVEL</button>
        <div class="levels">
          <button data-level="0">1<small>Forest</small></button>
          <button data-level="1">2<small>Castle</small></button>
          <button data-level="2">3<small>Train</small></button>
          <button data-level="3">4<small>Boss</small></button>
        </div>
        <button class="menu-btn" data-open="settings">⚙ SETTINGS</button>
        <button class="menu-btn" data-act="menu">⌂ MAIN MENU</button>
      </div>
    </div>
  </div>

  <div id="settings" class="screen">
    <div class="card settings-card">
      <div class="logo"><span>SETTINGS</span></div>
      <div id="settings-list"></div>
      <div class="menu-row"><button class="menu-btn" data-act="reset-settings">RESET</button><button class="menu-btn big" data-act="close-settings">✔ DONE</button></div>
    </div>
  </div>
  <div id="loading" class="screen show"><div class="spin"></div></div>

  <script src="js/three.min.js"></script>
  <script src="js/util.js?v=12"></script>
  <script src="js/figures.js?v=12"></script>
  <script src="js/config.js?v=12"></script>
  <script src="js/audio.js?v=12"></script>
  <script src="js/fx.js?v=12"></script>
  <script src="js/characters.js?v=12"></script>
  <script src="js/worlds.js?v=12"></script>
  <script src="js/obstacles.js?v=12"></script>
  <script src="js/boss.js?v=12"></script>
  <script src="js/settings.js?v=12"></script>
  <script src="js/ui.js?v=12"></script>
  <script src="js/main.js?v=12"></script>
</body>
</html>
